name: solvate_md
channels:
  - conda-forge
dependencies:
  - python=3.11
  - packmol
  - xtb
  - ase
  - tblite
  - tblite-python
  - numpy
  # dftd4 4.2.0 segfaults in get_polarizabilities on this cluster (SIGSEGV
  # inside libdftd4's OpenMP region, reproducible even single-threaded, with
  # tblite 0.6.0); pin <4 until upstream fixes it.
  - dftd4<4
